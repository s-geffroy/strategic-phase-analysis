name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tout passe par le conteneur : aucune installation locale (cf. règles projet).
      - name: Construire l'image
        run: docker compose build base

      - name: pytest + validateurs + export matrice
        run: docker compose run --rm validate
